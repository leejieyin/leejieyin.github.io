<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week 3 exercise 2</title>
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <img src="images/Logo.png" width="160">
            </div>
            <div class="nav-links">
                <p>About us</p>
                <p>Services</p>
                <p>Use Cases</p>
                <p>Pricing</p>
                <p>Blog</p>
                <p class="quote-button">Request a Quote</p>
            </div>
            <div class="hamburger">
                <img src="images/more.png" width="20">
            </div>
        </div>

        <div class="hero">

            <div class="hero-text">
                <h1>Navigating the <br>
                    digital landscape
                    <br>for success
                </h1>

                    through a range of services
                    including SEO, PPC, and social media marketing, and content creation.</p>
                <p class="consultation-button">Book a consultation</p>
            </div>

            <div><img src="images/Illustration.png" alt="Megaphone illustration" width="80%"></div>
        </div>

        <div class="company-logos">
            <img src="images/Amazon.png" alt="amazon">
            <img src="images/Dribbble.png" alt="dribbble">
            <img src="images/HubSpot.png" alt="hubspot">
            <img src="images/notion.png" alt="notion">
            <img src="images/netflix.png" alt="netflix">
            <img src="images/zoom.png" alt="zoom">

        </div>
    </div>

</html>
